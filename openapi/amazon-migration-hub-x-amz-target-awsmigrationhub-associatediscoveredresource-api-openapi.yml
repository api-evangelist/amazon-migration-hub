components:
  parameters:
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  schemas:
    AssociateDiscoveredResourceResult:
      type: object
      properties: {}
    MigrationTaskName:
      type: string
      pattern: '[^:|]+'
      minLength: 1
      maxLength: 256
    InvalidInputException: {}
    DiscoveredResourceDescription:
      type: string
      pattern: ^.{0,500}$
      minLength: 0
      maxLength: 500
    AccessDeniedException: {}
    ServiceUnavailableException: {}
    InternalServerError: {}
    DryRunOperation: {}
    ThrottlingException: {}
    ConfigurationId:
      type: string
      pattern: ^.{1,1600}$
      minLength: 1
      maxLength: 1600
    UnauthorizedOperation: {}
    ProgressUpdateStream:
      type: string
      pattern: '[^/:|\000-\037]+'
      minLength: 1
      maxLength: 50
    HomeRegionNotSetException: {}
    PolicyErrorException: {}
    DiscoveredResource:
      type: object
      required:
      - ConfigurationId
      properties:
        ConfigurationId:
          allOf:
          - $ref: '#/components/schemas/ConfigurationId'
          - description: The configurationId in Application Discovery Service that uniquely identifies the on-premise resource.
        Description:
          allOf:
          - $ref: '#/components/schemas/DiscoveredResourceDescription'
          - description: A description that can be free-form text to record additional detail about the discovered resource for clarity or later reference.
      description: Object representing the on-premises resource being migrated.
    AssociateDiscoveredResourceRequest:
      type: object
      required:
      - ProgressUpdateStream
      - MigrationTaskName
      - DiscoveredResource
      title: AssociateDiscoveredResourceRequest
      properties:
        ProgressUpdateStream:
          allOf:
          - $ref: '#/components/schemas/ProgressUpdateStream'
          - description: The name of the ProgressUpdateStream.
        MigrationTaskName:
          allOf:
          - $ref: '#/components/schemas/MigrationTaskName'
          - description: 'The identifier given to the MigrationTask. <i>Do not store personal data in this field.</i> '
        DiscoveredResource:
          allOf:
          - $ref: '#/components/schemas/DiscoveredResource'
          - description: Object representing a Resource.
        DryRun:
          allOf:
          - $ref: '#/components/schemas/DryRun'
          - description: Optional boolean flag to indicate whether any effect should take place. Used to test if the caller has permission to make the call.
    DryRun:
      type: boolean
    ResourceNotFoundException: {}
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
