tags:
- name: '#X Amz Target=AWSMigrationHub.ListCreatedArtifacts'
paths:
  /#X-Amz-Target=AWSMigrationHub.ListCreatedArtifacts:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListCreatedArtifacts
      description: <p>Lists the created artifacts attached to a given migration task in an update stream. This API has the following traits:</p> <ul> <li> <p>Gets the list of the created artifacts while migration is taking place.</p> </li> <li> <p>Shows the artifacts created by the migration tool that was associated by the <code>AssociateCreatedArtifact</code> API. </p> </li> <li> <p>Lists created artifacts in a paginated interface. </p> </li> </ul>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCreatedArtifactsResult'
              examples:
                ListCreatedArtifacts200Example:
                  summary: Default ListCreatedArtifacts 200 response
                  x-microcks-default: true
                  value:
                    NextToken: example-value
                    CreatedArtifactList: example-value
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
              examples:
                ListCreatedArtifacts480Example:
                  summary: Default ListCreatedArtifacts 480 response
                  x-microcks-default: true
                  value: {}
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
              examples:
                ListCreatedArtifacts481Example:
                  summary: Default ListCreatedArtifacts 481 response
                  x-microcks-default: true
                  value: {}
        '482':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
              examples:
                ListCreatedArtifacts482Example:
                  summary: Default ListCreatedArtifacts 482 response
                  x-microcks-default: true
                  value: {}
        '483':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableException'
              examples:
                ListCreatedArtifacts483Example:
                  summary: Default ListCreatedArtifacts 483 response
                  x-microcks-default: true
                  value: {}
        '484':
          description: InvalidInputException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidInputException'
              examples:
                ListCreatedArtifacts484Example:
                  summary: Default ListCreatedArtifacts 484 response
                  x-microcks-default: true
                  value: {}
        '485':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
              examples:
                ListCreatedArtifacts485Example:
                  summary: Default ListCreatedArtifacts 485 response
                  x-microcks-default: true
                  value: {}
        '486':
