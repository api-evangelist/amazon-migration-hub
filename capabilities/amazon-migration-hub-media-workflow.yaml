naftiko: 1.0.0-alpha1
info:
  label: Amazon Migration Hub Workflow
  description: Workflow capability for Amazon Migration Hub media processing operations for broadcast engineers and media developers.
  tags:
  - AWS
  - Media
  - Broadcasting
  - Workflow
  created: '2026-04-19'
  modified: '2026-04-19'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - import: migration_hub
    location: ./shared/migration-hub.yaml
  exposes:
  - type: rest
    port: 8080
    namespace: migration-hub-workflow-api
    description: Unified REST API for Amazon Migration Hub workflow management.
    resources:
    - path: /v1/jobs
      name: jobs
      description: Manage media processing jobs
      operations:
      - method: GET
        name: list-jobs
        description: List jobs
        call: migration_hub.list-jobs
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: migration-hub-workflow-mcp
    transport: http
    description: MCP server for AI-assisted Amazon Migration Hub workflow management.
    tools:
    - name: associate-created-artifact
      description: AssociateCreatedArtifact
      hints:
        readOnly: false
        openWorld: true
      call: migration_hub.associate-created-artifact
      outputParameters:
      - type: object
        mapping: $.
    - name: associate-discovered-resource
      description: AssociateDiscoveredResource
      hints:
        readOnly: false
        openWorld: true
      call: migration_hub.associate-discovered-resource
      outputParameters:
      - type: object
        mapping: $.
    - name: create-progress-update-stream
      description: CreateProgressUpdateStream
      hints:
        readOnly: false
        openWorld: true
      call: migration_hub.create-progress-update-stream
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-progress-update-stream
      description: DeleteProgressUpdateStream
      hints:
        readOnly: false
        openWorld: true
      call: migration_hub.delete-progress-update-stream
      outputParameters:
      - type: object
        mapping: $.
    - name: describe-application-state
      description: DescribeApplicationState
      hints:
        readOnly: false
        openWorld: true
      call: migration_hub.describe-application-state
      outputParameters:
      - type: object
        mapping: $.
    - name: describe-migration-task
      description: DescribeMigrationTask
      hints:
        readOnly: false
        openWorld: true
      call: migration_hub.describe-migration-task
      outputParameters:
      - type: object
        mapping: $.
    - name: disassociate-created-artifact
      description: DisassociateCreatedArtifact
      hints:
        readOnly: false
        openWorld: true
      call: migration_hub.disassociate-created-artifact
      outputParameters:
      - type: object
        mapping: $.
    - name: disassociate-discovered-resource
      description: DisassociateDiscoveredResource
      hints:
        readOnly: false
        openWorld: true
      call: migration_hub.disassociate-discovered-resource
      outputParameters:
      - type: object
        mapping: $.
