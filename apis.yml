aid: amazon-migration-hub
name: Amazon Migration Hub
description: >-
  AWS Migration Hub provides a single location to track the progress of
  application migrations across multiple AWS and partner solutions. It allows
  you to choose the migration tools that best fit your needs and get a single
  view of the status of all migrations.
